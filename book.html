<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book an appointment · Maison Elowen</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
<h1>Book an appointment</h1><p>Tell us a little about you and when you would like to come. We will get back to you to confirm a time.</p>
<div id="confirm" class="confirm hidden" role="status" tabindex="-1"></div>
<form id="form">
<label for="name">Name</label><input type="text" id="name" name="name" required autocomplete="name">
<label for="email">Email</label><input type="email" id="email" name="email" required autocomplete="email">
<label for="phone">Phone</label><input type="tel" id="phone" name="phone" required autocomplete="tel">
<label for="date">Preferred date</label><input type="date" id="date" name="date" required>
<label for="size">Dress size</label><select id="size" name="size" required></select>
<label for="budget">Budget range</label><select id="budget" name="budget" required></select>
<label for="message">Anything you would like to tell us</label><textarea id="message" name="message" rows="4"></textarea>
<p><button class="btn" type="submit">Book an appointment</button></p>
<p><small>Your booking is saved in this browser only. It is not sent anywhere yet.</small></p>
</form>
</main>
<script src="js/common.js"></script>
<script src="js/ai.js"></script>
<script src="js/settings.js"></script>
<script src="js/book.js"></script>
</body>
</html>
